# docker-compose.yml - Claude Code sandbox цього проєкту без IDE-інтеграції.
# Для VS Code використовуй .devcontainer/devcontainer.json.
# Firewall: .devcontainer/init-firewall.sh, копіюється в образ через Dockerfile.

services:
  claude:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile
    user: node
    working_dir: /workspace
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - .:/workspace:delegated
      - claude-config:/home/node/.claude
      - claude-history:/commandhistory
    environment:
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    entrypoint: ["/bin/bash", "-c", "sudo /usr/local/bin/init-firewall.sh && exec bash"]
    stdin_open: true
    tty: true
    mem_limit: 4g

volumes:
  claude-config:
  claude-history:
